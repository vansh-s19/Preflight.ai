<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Promo tile</title>
  <!-- Chrome Web Store small promo tile, 440x280. -->
  <style>
    html, body { margin: 0; width: 440px; height: 280px; overflow: hidden; }
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 18px;
      padding: 0 36px;
      box-sizing: border-box;
      background: linear-gradient(150deg, #172033, #22314f);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .brand { display: flex; align-items: center; gap: 14px; }
    .brand img { width: 56px; height: 56px; }
    .brand span { font-size: 30px; font-weight: 750; letter-spacing: -0.02em; }
    h1 { margin: 0; font-size: 25px; line-height: 1.25; font-weight: 650; letter-spacing: -0.01em; }
    p { margin: 0; color: #b9c3d6; font-size: 15px; }
  </style>
</head>
<body>
  <div class="brand">
    <img src="../../extension/icons/icon128.png" alt="" />
    <span>Preflight.ai</span>
  </div>
  <h1>Catch personal data and secrets before they reach AI chat.</h1>
  <p>Free · Runs on your device</p>
</body>
</html>
