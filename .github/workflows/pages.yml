# Publishes website/ to GitHub Pages (served at preflightai.in) whenever it
# changes on main. Can also be run by hand from the Actions tab.
name: Deploy website

on:
  push:
    branches: [main]
    paths: ["website/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Pages lets browsers cache files for 10 minutes. Stamping each CSS/JS
      # link with the commit means a new page never pairs with old styles.
      - name: Version asset links
        run: sed -i "s/?v=dev\"/?v=${GITHUB_SHA::8}\"/g" website/*.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - id: deployment
        uses: actions/deploy-pages@v4
